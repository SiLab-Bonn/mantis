[general]
output_directory = "data"
# daq_conf = # '<path-to>bdaq53.yaml'

[scan_configuration]
start_column = 0
stop_column = 224
start_row = 0
stop_row = 512

scan_timeout = 10 # Timeout for scan after which the scan will be stopped, in seconds; if False no limit on scan time
max_triggers = false # Number of maximum received triggers after stopping readout, if False no limit on received trigger

[powering]  # Additional/Other power supply files may be found here and copied to lab_devices:
            # https://github.com/SiLab-Bonn/basil/tree/master/basil/HL


[powering.devices.keithley2400]
name = "Keithley2400"
# yaml = "<path-to>keithley2400.yaml"
connection = "port=/dev/ttyUSB0"
channels = 1
comment = "High voltage supply W18R05"
# max_voltage = 10
max_current = 0.001
ocp = true

[powering.devices.keithley2410]
name = "Keithley2410"
# yaml = "<path-to>keithley2410.yaml"
connection = "port=/dev/ttyUSB1"
channels = 1
comment = "High voltage supply W14R13"
# max_voltage = 10
max_current = 0.001
ocp = true

[powering.devices.ttiql355tp]
name = "TTI QL355TP"
# yaml = "<path-to>ttiql355tp.yaml"
connection = "port=/dev/ttyACM0"
comment = ""
channels = 3

[powering.devices.ttiql355tp.channel_comments]
CH0 = "Psub/Pwell for detector W18R05"
CH1 = "Psub/Pwell for detector W14R13"
CH2 = "Power supply for BQAD board"

[modules]
[modules.module_0]
identifier = "unknown"
[modules.module_0.chip_0]
chip_sn = "W18R05"
chip_id = 0
receiver = "rx0"
chip_config_file = "" # If defined: use config from in file (either .cfg.yaml or .h5). If not defined use chip config of latest scan and std. config if no previous scan exists
send_data = "tcp://127.0.0.1:5500"

# Example for adding more chips:
[modules.module_0.chip_1]
chip_sn = "W14R13"
chip_id = 1
receiver = "rx1"
chip_config_file = ""
send_data = "tcp://127.0.0.1:6500"

