transfer_layer:
  - name     : Serial
    type     : Serial
    init     :
        port     : /dev/ttyUSB0
        read_termination : "\n"
        write_termination: "\n"
        timeout: 1
        baudrate : 19200

hw_drivers:
  - name      : Keithley2400
    type      : scpi
    interface : Serial
    init:
      device : Keithley 2400
