[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "1.0"
license = { "text" = "AGPL-3.0" }
description = "Control software for TJ-Monopix2 telescope"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.12"
authors = [
    {name = "Wiebke Buhmann", email="s6wibuhm@uni-bonn.de"},
    {name = "Rasmus Partzsch", email="rasmus.partzsch@uni-bonn.de"}
]
dependencies = [
    "toml",
    "PyQt6",
    "pyserial"
]


[project.urls]
"Repository" = "https://github.com/SiLab-Bonn/mantis/"


[project.scripts]
mantisgui = "mantis.gui:main"
